# CI 工作流 - 每次推送和PR时自动构建验证
# 参考 kafka-visark: 使用平台对应的具体类型，而非 app-image
# 原因: pom.xml 中配置了 linuxPackageName/winShortcut 等选项，
#       这些选项只能用于具体安装包类型(deb/rpm/exe/dmg)，不兼容 app-image
name: CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: windows-latest
            type: exe
          - os: macos-latest
            type: dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      # Linux 专用 - 安装打包工具
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: 验证 Java
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: 执行打包
        run: mvn -B clean jfx:package -DAPP_TYPE=${{ matrix.type }}

      - name: 验证构建产物
        shell: bash
        run: |
          echo "✅ Build completed successfully on ${{ matrix.os }} (type: ${{ matrix.type }})"
          ls -lh target/javafx/ 2>/dev/null || dir target\\javafx
